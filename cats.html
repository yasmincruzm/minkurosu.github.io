    <style>
        /* =====================================================
           MASONRY - mesmo CSS em webweaving.html e cats.html
           Só mudam as variáveis no style do #masonryContainer:
             --masonryCols  (número de colunas)
             --masonryGap   (espaço entre as células)
           ===================================================== */

        #masonryContainer,
        #masonryContainer * {
            box-sizing: border-box;
        }

        #masonryContainer {
            --masonryCols: 3;
            --masonryGap: 6px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 var(--masonryGap);
        }

        .masonryGrid {
            column-count: var(--masonryCols);
            column-gap: var(--masonryGap);
            padding: 0;
            margin: 0 auto;
            width: 100%;
            /* font-size + line-height definem a altura de cada <br> (20px) */
            font-size: 20px;
            line-height: 1;
        }

        @media (max-width: 600px) {
            .masonryGrid {
                column-count: 2;
            }
        }

        /* ---------- CÉLULA PADRÃO (igual ao antigo ww-cell) ---------- */
        .masonryCell {
            break-inside: avoid;
            page-break-inside: avoid;
            -webkit-column-break-inside: avoid;

            display: block;
            width: 100%;
            margin: 0 0 var(--masonryGap) 0;
            padding: 0;
            position: relative;
            line-height: 0;

            border: 1px solid #310000;
            border-radius: 2px;
            overflow: hidden;
            background: #0a0a0a;
            cursor: url('imgs/cursor/ROCKcursorselect.cur'), pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .masonryCell .masonryImg {
            width: 100%;
            height: auto;
            display: block;
            margin: 0;
            padding: 0;
            transition: transform 0.15s ease-in-out, filter 0.15s ease-in-out;
        }

        .masonryCell:hover .masonryImg {
            transform: scale(1.03);
            filter: saturate(0.4) brightness(1.05);
        }

        /* ---------- VARIAÇÃO: moldura branca + inclinação ---------- */
        .masonryCell.masonryFrame {
            padding: 8px;
            background: #fff;
            border: none;
            overflow: visible;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .masonryFrame:hover .masonryImg {
            transform: none;
        }

        /* legenda dentro da moldura branca */
        .masonryCaption {
            display: block;
            padding: 10px 0 4px 0;
            font-size: 14px;
            line-height: 1.2;
            color: #0a0a0a;
            text-align: center;
        }

        /* ---------- VARIAÇÃO: célula só de texto ---------- */
        .masonryCell.masonryText {
            padding: 0;
            font-size: 16px;
            line-height: 1.5;
            text-align: left;
            color: #5a5a5a;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            background: transparent;
            border: none;
            overflow: visible;
            cursor: url('imgs/cursor/ROCKcursornormal.cur'), auto;
            user-select: text;
        }

        @media (max-width: 600px) {
            .masonryCell.masonryFrame {
                padding: 6px;
            }
        }

        /* ---------- LIGHTBOX ---------- */
        .masonryOverlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(0, 0, 0, 0.92);
            justify-content: center;
            align-items: center;
            padding: 24px;
            cursor: zoom-out;
        }

        .masonryOverlay.is-open {
            display: flex;
            animation: masonryFade 0.15s ease-out;
        }

        @keyframes masonryFade {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .masonryOverlay img {
            max-width: 95vw;
            max-height: 92vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 4px;
            display: block;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }

        /* aberta a partir de uma moldura branca: leva a borda junto */
        .masonryOverlay.isFramed img {
            border: 8px solid #fff;
            border-radius: 2px;
        }

        .masonryOverlay::after {
            content: "✕";
            position: fixed;
            top: 16px;
            right: 20px;
            font-family: sans-serif;
            font-size: 26px;
            color: #fff;
            background: rgba(60, 0, 0, 0.75);
            width: 42px;
            height: 42px;
            line-height: 42px;
            text-align: center;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="layout-with-sidebars">
        <main id="containerprincipal">
            <div id="masonryContainer" style="--masonryCols: 2; --masonryGap: 14px;">
                <div class="masonryGrid">

                    <div class="masonryCell masonryFrame" style="transform: rotate(-2deg);" data-full="imgs/cats/cat01.jpg">
                        <img class="masonryImg" src="imgs/cats/cat01.jpg" alt="" loading="lazy" />
                    </div>

                    <div class="masonryCell masonryText">
                        ele me olhou assim e eu entendi tudo
                    </div>

                    <div class="masonryCell masonryFrame" style="width: 95%; margin-left: 5%; transform: rotate(4deg);" data-full="imgs/cats/cat02.jpg">
                        <img class="masonryImg" src="imgs/cats/cat02.jpg" alt="" loading="lazy" />
                        <span class="masonryCaption">soneca das 15h</span>
                    </div>

                    <br>

                    <div class="masonryCell masonryFrame" style="transform: rotate(2deg);" data-full="imgs/cats/cat03.jpg">
                        <img class="masonryImg" src="imgs/cats/cat03.jpg" alt="" loading="lazy" />
                    </div>

                    <div class="masonryCell masonryFrame" style="width: 90%; transform: rotate(-4deg);" data-full="imgs/cats/cat04.jpg">
                        <img class="masonryImg" src="imgs/cats/cat04.jpg" alt="" loading="lazy" />
                    </div>

                </div>
            </div>
        </main>
    </div>

    <div class="masonryOverlay" id="masonryOverlay">
        <img src="" alt="">
    </div>

    <script>
        (function () {
            var overlay = document.getElementById('masonryOverlay');
            var overlayImg = overlay.querySelector('img');
            var container = document.getElementById('masonryContainer');

            // inclinações aleatórias de 2 em 2 (só nas .masonryFrame SEM rotate no style)
            var rots = [-4, -2, 2, 4];

            function openLightbox(src, framed) {
                overlayImg.src = src;
                overlay.classList.toggle('isFramed', !!framed);
                overlay.classList.add('is-open');
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox() {
                overlay.classList.remove('is-open');
                overlayImg.src = '';
                document.body.style.overflow = '';
            }

            container.querySelectorAll('.masonryFrame').forEach(function (cell) {
                if (!cell.style.transform) {
                    var r = rots[Math.floor(Math.random() * rots.length)];
                    cell.style.transform = 'rotate(' + r + 'deg)';
                }
            });

            container.querySelectorAll('.masonryCell').forEach(function (cell) {
                cell.addEventListener('click', function (e) {
                    var src = cell.getAttribute('data-full');
                    if (!src) return;
                    e.preventDefault();
                    e.stopPropagation();
                    openLightbox(src, cell.classList.contains('masonryFrame'));
                });
            });

            overlay.addEventListener('click', function (e) {
                e.preventDefault();
                closeLightbox();
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeLightbox();
            });
        })();
    </script>
