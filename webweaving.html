    <style>

        #webweaving-container,
        #webweaving-container * {
            box-sizing: border-box;
        }

        #webweaving-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 6px;
        }

        .ww-grid {
            column-count: 3;
            column-gap: 6px;
            padding: 0;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 600px) {
            .ww-grid {
                column-count: 2;
            }
        }

        .ww-cell {
            break-inside: avoid;
            page-break-inside: avoid;
            -webkit-column-break-inside: avoid;

            display: block;
            width: 100%;
            margin: 0 0 6px 0;
            padding: 0;
            position: relative;
            line-height: 0;

            border: 1px solid #310000;
            border-radius: 2px;
            overflow: hidden;
            background: #0a0a0a;
            cursor: url('imgs/cursor/ROCKcursorselect.cur'), pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .ww-cell .thumb-img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0;
            padding: 0;
            transition: transform 0.15s ease-in-out, filter 0.15s ease-in-out;
        }

        .ww-cell:hover .thumb-img {
            transform: scale(1.03);
            filter: saturate(0.4) brightness(1.05);
        }

        .ww-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(0, 0, 0, 0.92);
            justify-content: center;
            align-items: center;
            padding: 24px;
            cursor: zoom-out;
        }

        .ww-overlay.is-open {
            display: flex;
            animation: wwFade 0.15s ease-out;
        }

        @keyframes wwFade {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .ww-overlay img {
            max-width: 95vw;
            max-height: 92vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 4px;
            display: block;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }

        .ww-overlay::after {
            content: "✕";
            position: fixed;
            top: 16px;
            right: 20px;
            font-family: sans-serif;
            font-size: 26px;
            color: #fff;
            background: rgba(60, 0, 0, 0.75);
            width: 42px;
            height: 42px;
            line-height: 42px;
            text-align: center;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>

    <script>
        (function () {
            var overlay = document.getElementById('wwOverlay');
            var overlayImg = overlay.querySelector('img');
            var container = document.getElementById('webweaving-container');

            function openLightbox(src) {
                overlayImg.src = src;
                overlay.classList.add('is-open');
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox() {
                overlay.classList.remove('is-open');
                overlayImg.src = '';
                document.body.style.overflow = '';
            }

            container.querySelectorAll('.ww-cell').forEach(function (cell) {
                cell.addEventListener('click', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    var src = cell.getAttribute('data-full');
                    if (src) openLightbox(src);
                });
            });

            overlay.addEventListener('click', function (e) {
                e.preventDefault();
                closeLightbox();
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeLightbox();
            });
        })();
    </script>
