<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="emo.css" id="theme-stylesheet">
    <link rel="stylesheet" href="gallery.css">

    <style>
      
        html,
        body {
            margin: 0;
            padding: 0;
            font-family: "MinFont";
            background-image: none;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
        }


        .skin-grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            justify-content: center;
            padding: 0;
            max-width: 100%;
        }

        .skin-item {
            height: 200px;
            overflow: hidden;
        }

        .skin-item img {
            width: 100%;
            max-height: 150px;
            object-fit: contain;
            border-radius: 4px;
            margin-bottom: 8px;
            display: block;
        }

        .skin-title {
            font-size: 0.9em;
            color: #534F4A;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }


        .gallery {
            display: flex;
            flex-direction: column;   
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 636px;
            margin: 0 auto;
        }

        .gallery .gallery-item {
            position: relative;
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            min-height: 0;
            max-height: none;
            aspect-ratio: auto;
            margin: 0;
            padding: 0;
        }

        .gallery .gallery-item input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
            margin: 0;
            pointer-events: none;
        }

        .gallery .gallery-item img:not(.full) {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }

        .gallery .gallery-item .caption {
            display: block;
            position: static;
            opacity: 1;
            visibility: visible;
            transform: none;
            height: auto;
            max-height: none;
            margin: 8px 0 0;
            padding: 0;
            font-size: 0.8em;
            text-align: center;
        }

        .gallery .gallery-item:has(input:checked) img:not(.thumbnail) {
            aspect-ratio: auto;
            object-fit: contain;
        }
    </style>
</head>

<body>
