<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>drawbox</title>
    <link rel="stylesheet" href="emo.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        #gallery-static,
        #gallery-dynamic {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto 30px;
        }

        .image-container {
            border: 1px solid #310000;
            border-radius: 2px;
            overflow: hidden;
        }

        .image-container img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }

        .image-container p {
            font-size: 0.7em;
            color: #5a5a5a;
            text-align: center;
            margin: 4px 0;
        }
    </style>
</head>

<body>

    <div id="drawbox-wrap" style="max-width:900px; margin:0 auto 20px; background:#c0c0c0; border:2px solid #000; box-shadow: inset -2px -2px 0 #404040, inset 2px 2px 0 #fff; padding:4px; font-family: 'Courier New', monospace;">
        <div style="display:flex; align-items:center; justify-content:space-between; background:#d9d9d9; border:2px solid #000; border-bottom:none; padding:4px 8px; font-weight:bold; font-size:0.76rem; color:#111; letter-spacing:0.04em; text-transform:lowercase;">
            <span>paint</span>
            <span style="color:#444;">drawbox</span>
        </div>
        <div id="drawbox-toolbar" style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:#d9d9d9; border:2px solid #000; border-bottom:none; padding:8px 10px; font-size:0.8rem; color:#111; text-transform:lowercase;">
            <label style="display:flex; align-items:center; gap:6px;">
                <span>cor</span>
                <input id="brush-color" type="color" value="#000000" aria-label="Cor do pincel" style="width:38px; height:24px; border:1px solid #000; background:#fff; padding:0; cursor:pointer;">
            </label>
            <label style="display:flex; align-items:center; gap:6px;">
                <span>tamanho</span>
                <input id="brush-size" type="range" min="1" max="30" value="6" aria-label="Tamanho do pincel" style="accent-color:#111; width:140px;">
            </label>
            <button id="clear-btn" type="button" style="border:2px solid #000; background:#e8e8e8; color:#111; padding:4px 10px; cursor:pointer; font-family:'Courier New', monospace; text-transform:lowercase; box-shadow: inset -1px -1px 0 #7a7a7a, inset 1px 1px 0 #fff;">limpar</button>
            <button id="save-btn" type="button" style="border:2px solid #000; background:#d9d9d9; color:#111; padding:4px 10px; cursor:pointer; font-family:'Courier New', monospace; font-weight:bold; text-transform:lowercase; box-shadow: inset -1px -1px 0 #7a7a7a, inset 1px 1px 0 #fff;">salvar</button>
        </div>
        <div style="background:#bdbdbd; border:2px solid #000; padding:8px; box-shadow: inset 2px 2px 0 #fff, inset -2px -2px 0 #808080;">
            <canvas id="drawbox-canvas" width="900" height="640" aria-label="Área de desenho" style="display:block; width:100%; height:640px; max-width:100%; background:#f3f3f3; border:2px solid #000; box-shadow: inset 2px 2px 0 #fff, inset -2px -2px 0 #808080; touch-action:none;"></canvas>
        </div>
    </div>

    <h2>art by you &lt;3</h2>
    <div id="gallery-static">
        <div class="image-container">
            <img src="imgs/artbyyou/byAllanHiker.jpg" alt="by @allanhiker" loading="lazy">
        </div>
        <div class="image-container">
            <img src="imgs/artbyyou/gatoemo.webp" alt="sent by straw.page" loading="lazy">
        </div>
        <div class="image-container">
            <img src="imgs/artbyyou/h_wallacepires.jpg" alt="by @h_wallacepires" loading="lazy">
        </div>
        <div class="image-container">
            <img src="imgs/artbyyou/brasilsilsil.webp" alt="straw.page" loading="lazy">
        </div>
        <div class="image-container">
            <img src="imgs/artbyyou/Screenshot_20250718_175121_Gallery.jpg" alt="sent by instagram" loading="lazy">
        </div>
        <div class="image-container">
            <img src="imgs/artbyyou/Screenshot_20250718_175137_Gallery.jpg" alt="sent by instagram" loading="lazy">
        </div>
        <div class="image-container">
            <img src="imgs/artbyyou/a.jpg" alt="sent by instagram" loading="lazy">
        </div>
    </div>

    <h2>enviados recentemente</h2>
    <div id="gallery-dynamic">loading...</div>

    <script type="module">
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {
  getFirestore, collection, addDoc, doc, setDoc, serverTimestamp,
  query, orderBy, limit, onSnapshot
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyA8-Ab2dE48sVOhmT-HfxIL5_rzDMRdcCc",
  authDomain: "minkurosu.firebaseapp.com",
  projectId: "minkurosu",
  storageBucket: "minkurosu.firebasestorage.app",
  messagingSenderId: "290821725607",
  appId: "1:290821725607:web:5e39e561da53ac7c8a2a82",
  measurementId: "G-M7PWC6DDRH"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getFirestore(app);

const MAX_GALLERY_ITEMS = 60;
const MAX_IMAGE_BYTES = 700 * 1024;

const canvas = document.getElementById("drawbox-canvas");
const ctx = canvas.getContext("2d");
const brushColor = document.getElementById("brush-color");
const brushSize = document.getElementById("brush-size");
const saveBtn = document.getElementById("save-btn");
const clearBtn = document.getElementById("clear-btn");

let isDrawing = false;
let lastX = 0;
let lastY = 0;

function clearCanvas() {
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function getPoint(event) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: ((event.clientX - rect.left) / rect.width) * canvas.width,
    y: ((event.clientY - rect.top) / rect.height) * canvas.height,
  };
}

function startDrawing(event) {
  const point = getPoint(event);
  isDrawing = true;
  lastX = point.x;
  lastY = point.y;
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
}

function draw(event) {
  if (!isDrawing) return;
  const point = getPoint(event);
  ctx.lineWidth = Number(brushSize.value);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = brushColor.value;
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(point.x, point.y);
  ctx.stroke();
  lastX = point.x;
  lastY = point.y;
}

function stopDrawing() {
  isDrawing = false;
}

canvas.addEventListener("pointerdown", startDrawing);
canvas.addEventListener("pointermove", draw);
canvas.addEventListener("pointerup", stopDrawing);
canvas.addEventListener("pointerleave", stopDrawing);
canvas.addEventListener("pointercancel", stopDrawing);

clearCanvas();
clearBtn.addEventListener("click", clearCanvas);

saveBtn.addEventListener("click", async () => {
  canvas.toBlob(async (blob) => {
    if (!blob) {
      alert("erro ao gerar imagem.");
      return;
    }

    const ok = await submitDrawing(blob);
    if (ok) {
      clearCanvas();
    }
  }, "image/png");
});

function detectDevice() {
  const ua = navigator.userAgent;
  if (/iPad|Tablet/i.test(ua)) return "Tablet";
  if (/Mobi|Android|iPhone/i.test(ua)) return "Mobile";
  return "Desktop";
}

function detectBrowser() {
  const ua = navigator.userAgent;
  if (ua.includes("Edg/")) return "Edge";
  if (ua.includes("OPR/") || ua.includes("Opera")) return "Opera";
  if (ua.includes("Firefox/")) return "Firefox";
  if (ua.includes("Chrome/") && !ua.includes("Edg/")) return "Chrome";
  if (ua.includes("Safari/") && !ua.includes("Chrome/")) return "Safari";
  return "Unknown";
}

function detectOS() {
  const ua = navigator.userAgent;
  if (/Windows/i.test(ua)) return "Windows";
  if (/Mac OS X/i.test(ua)) return "macOS";
  if (/Android/i.test(ua)) return "Android";
  if (/iPhone|iPad|iOS/i.test(ua)) return "iOS";
  if (/Linux/i.test(ua)) return "Linux";
  return "Unknown";
}

async function collectVisitorMeta() {
  let ip = null, city = null, region = null, country = null, cc = null;
  try {
    const res = await fetch("https://ip-api.com/json/?fields=status,country,countryCode,regionName,city,query");
    const data = await res.json();
    if (data.status === "success") {
      ip = data.query; city = data.city; region = data.regionName;
      country = data.country; cc = data.countryCode;
    }
  } catch { }

  return {
    ip, city, region, country, cc,
    device: detectDevice(),
    browser: detectBrowser(),
    os: detectOS(),
    page: location.pathname,
    referrer: document.referrer || "direct",
    lang: navigator.language || null,
  };
}

function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function blobToStoredImage(blob) {
  let dataUrl = await blobToDataURL(blob);
  if (dataUrl.length <= MAX_IMAGE_BYTES) return dataUrl;

  const bitmap = await createImageBitmap(blob);
  const tempCanvas = document.createElement("canvas");
  tempCanvas.width = bitmap.width;
  tempCanvas.height = bitmap.height;
  const tctx = tempCanvas.getContext("2d");
  tctx.fillStyle = "white";
  tctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
  tctx.drawImage(bitmap, 0, 0);

  for (const quality of [0.85, 0.7, 0.5, 0.35]) {
    dataUrl = tempCanvas.toDataURL("image/jpeg", quality);
    if (dataUrl.length <= MAX_IMAGE_BYTES) return dataUrl;
  }
  return null;
}

async function submitDrawing(blob) {
  const imageData = await blobToStoredImage(blob);
  if (!imageData) {
    alert("file too big.");
    return false;
  }

  try {
    const publicDoc = await addDoc(collection(db, "drawings"), {
      imageUrl: imageData,
      timestamp: serverTimestamp(),
    });

    const meta = await collectVisitorMeta();
    await setDoc(doc(db, "drawings_meta", publicDoc.id), {
      imageUrl: imageData,
      timestamp: serverTimestamp(),
      ...meta,
    });

    alert("sent");
    return true;
  } catch (error) {
    console.error(error);
    alert("error");
    return false;
  }
}

function renderGallery(snapshot) {
  const gallery = document.getElementById("gallery-dynamic");
  if (!gallery) return;

  if (snapshot.empty) {
    gallery.innerHTML = `<p style="text-align:center;color:#5a5a5a;grid-column:1/-1;">nenhum desenho ainda, seja a primeira pessoa! ☻</p>`;
    return;
  }

  gallery.innerHTML = snapshot.docs.map(docSnap => {
    const d = docSnap.data();
    const ts = d.timestamp?.toDate ? d.timestamp.toDate() : null;
    const dateStr = ts ? ts.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" }) : "";
    return `
      <div class="image-container">
        <img src="${d.imageUrl}" alt="sent" loading="lazy">
        <p>${dateStr}</p>
      </div>`;
  }).join("");
}

if (typeof window.__drawboxUnsubscribe === "function") {
  window.__drawboxUnsubscribe();
}

const galleryQuery = query(collection(db, "drawings"), orderBy("timestamp", "desc"), limit(MAX_GALLERY_ITEMS));
window.__drawboxUnsubscribe = onSnapshot(galleryQuery, renderGallery, err => {
  console.error("erro ao carregar galeria:", err);
  const gallery = document.getElementById("gallery-dynamic");
  if (gallery) gallery.textContent = "error";
});
    </script>

</body>

</html>
