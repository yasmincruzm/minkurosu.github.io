<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <link rel="stylesheet" href="emo.css" id="theme-stylesheet">
    <link rel="stylesheet" href="screenshots-fit.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css" />
    <style>
        html,
        body {
            background-color: #24211e00;
            margin: 0;
            padding: 0;

            font-family: "MinFont";
            background-image: none;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: hidden;

        }

        hr {
            border: 5px;
            border-top: 0.0625rem solid #ececec;
            margin: 1.25rem 0;
        }


        #containerprincipal {
            width: 100%;
        }

        .caixamaisclara {
            background-color: #24211e;
            border-radius: 0.9375rem;
            padding: 10px;
        }

        .content-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            box-sizing: border-box;

        }

        h3 {
            text-align: center;
            margin-top: 25px;
            margin-bottom: 20px;
            color: #534F4A;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            text-transform: uppercase;
        }

        h2 {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 20px;
            color: #534F4A;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            text-transform: lowercase;
        }


        .skin-grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            justify-content: center;
            padding: 0;
            max-width: 100%;
        }

        .skin-item {

            height: 200px;
            overflow: hidden;

        }

        .skin-item img {
            width: 100%;
            max-height: 150px;
            object-fit: contain;
            border-radius: 4px;
            margin-bottom: 8px;
            display: block;
        }

        .skin-title {
            font-size: 0.9em;
            color: #534F4A;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }


        @media (max-width: 768px) {
            .skin-grid-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            .skin-item {
                height: 180px;
            }

            .skin-item img {
                max-height: 130px;
            }
        }

        @media (max-width: 550px) {
            .skin-grid-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .skin-item {
                padding: 8px;
                height: 160px;
            }

            .skin-item img {
                max-height: 110px;
            }

            .skin-title {
                font-size: 0.8em;
            }
        }

        @media (max-width: 380px) {
            .skin-grid-container {
                grid-template-columns: repeat(1, 1fr);
            }

            .skin-item {
                height: 200px;
            }

            .skin-item img {
                max-height: 150px;
            }
        }

        a[data-fancybox] img,
        img.screenshots,
        .fancybox-image,
        .fancybox__image,
        .fancybox-content img,
        .fancybox__content img {
            max-width: 100% !important;
            max-height: 100% !important;
            width: auto !important;
            height: auto !important;
            object-fit: contain !important;
            display: block !important;
            border-radius: 6px;
            box-sizing: border-box;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <main id="containerprincipal">
        <div class="content-column">
        



            <br>

           

            <a data-fancybox="gallery" href="imgs/games/tomodachi/Captura de tela 2026-04-13 191748.png">

            </a>

                <br>

            <a data-fancybox="gallery" href="imgs/games/tomodachi/Captura de tela 2026-04-13 200842.png">
                <img src="imgs/games/tomodachi/Captura de tela 2026-04-13 200842.png" class="screenshots">
            </a>
                <h5 class="screenshotDescription"> </h5>
                <br>

            <a data-fancybox="gallery" href="imgs/games/tomodachi/Captura de tela 2026-04-15 182132.png">
                <img src="imgs/games/tomodachi/Captura de tela 2026-04-15 182132.png" class="screenshots">
            </a>
                <h5 class="screenshotDescription"> </h5>
                <br>

            <a data-fancybox="gallery" href="imgs/games/tomodachi/Captura de tela 2026-04-21 234137.png">
                <img src="imgs/games/tomodachi/Captura de tela 2026-04-21 234137.png" class="screenshots">
            </a>
                <h5 class="screenshotDescription"> </h5>
                <br>

            <a data-fancybox="gallery" href="imgs/games/tomodachi/Captura de tela 2026-04-21 234806.png">
                <img src="imgs/games/tomodachi/Captura de tela 2026-04-21 234806.png" class="screenshots">
            </a>
                <h5 class="screenshotDescription"></h5>
                <br>

            <a data-fancybox="gallery" href="imgs/games/tomodachi/Captura de tela 2026-04-21 235521.png">
                <img src="imgs/games/tomodachi/Captura de tela 2026-04-21 235521.png" class="screenshots">
            </a>
                <h5 class="screenshotDescription"> </h5>
                <br>
               

        </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
    <script>
        Fancybox.bind('[data-fancybox="gallery"]', {
            dragToClose: true,
            Images: { zoom: false },
            Toolbar: { display: ["close"] },
        });
    </script>
    <style>
        .fancybox__container {
            --fancybox-bg: rgba(24, 20, 18, 0.92);
            max-width: 100dvw !important;
            max-height: 100dvh !important;
        }
        .fancybox__slide {
            padding: 8px !important;
        }
        .fancybox__content {
            max-width: 100% !important;
            max-height: 100% !important;
        }
        @media (max-width: 550px) {
            .fancybox__toolbar { --fancybox-thumbs-height: 0px; }
            .fancybox__nav { --f-button-width: 40px; --f-button-height: 40px; }
        }
    </style>
</body>

</html>
