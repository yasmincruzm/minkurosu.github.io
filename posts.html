<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <script src="oneko.js"></script>
  <script>NekoType = "black"</script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:image" content="https://i.ibb.co/RC2v9zg/sitethumbnail.png" />
  <meta name="color-scheme" content="light only">

  <title>@minkurosu</title>

  <link rel="alternate" type="application/rss+xml" title="minkurosu" href="rss.xml" />
  <link rel="icon" type="image/ico" href="imgs/site_imgs/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="emo.css" />

  <style>
    #posts-root {
      background: #1A1A1A;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 100px;
      text-align: left;
      overflow-x: hidden;
      max-width: 100%;
    }
    #posts-root *, #posts-root *::before, #posts-root *::after {
      box-sizing: border-box;
    }
    #posts-root div.banner {
      width: 100%; height: 380px; color: #FFF;
      display: flex; align-items: center; justify-content: center; background: #3BB9E3;
      overflow: hidden;
    }
    #posts-root div.banner img { width: 100%; height: 100%; object-fit: cover; }
    #posts-root .bar { height: 60px; display: flex; justify-content: center; background-color: #1A1A1A; box-shadow: 0 1px 1px #000000B0; }
    #posts-root .bar .container { align-items: center; padding-left: 285px; }
    #posts-root .bar .container ul { display: flex; height: 100%; list-style: none; }
    #posts-root .bar .container ul li { display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 0 15px; margin: 0 15px; position: relative; }
    #posts-root .bar .container ul li.active::after { content: ''; left: 0; width: 100%; height: 3px; bottom: 0; position: absolute; background: #3BB9E3; }
    #posts-root .bar .container ul li span { color: #B3B3B3; font-size: 12px; font-weight: bold; }
    #posts-root .bar .container ul li strong { color: #E1E8ED; font-size: 18px; margin-top: 2px; font-weight: bold; }
    #posts-root .bar .container ul li.active strong { color: #3BB9E3; }
    #posts-root .bar .container .actions button { width: 90px; height: 34px; display: flex; align-items: center; justify-content: center; margin-right: 20px; border: 0px; color: #E1E8ED; font-size: 14px; font-weight: bold; border-radius: 16px; border: 1px solid #E1E8ED; background-color: #1A1A1A; }
    #posts-root .bar .container .actions { display: flex; }

    #posts-root .wrapper-content { display: flex; justify-content: center; width: 100%; }

    #posts-root .wrapper-content .container {
      display: flex;
      align-items: flex-start;
      width: 100%;
      max-width: 1200px;
      padding: 0 30px;
      gap: 24px;
      background-color: #1A1A1A;
      box-sizing: border-box;
    }

    #posts-root .wrapper-content aside.profile { flex: 0 0 260px; width: 260px; }
    #posts-root .wrapper-content aside.profile img.avatar { width: 200px; height: 200px; border-radius: 50%; margin-top: -130px; border: 5px solid #1A1A1A; }
    #posts-root .wrapper-content aside.profile h1 { font-size: 21px; margin-top: 10px; color: #E1E8ED; }
    #posts-root .wrapper-content aside.profile span { font-size: 14px; color: #B3B3B3; }
    #posts-root .wrapper-content aside.profile p { font-size: 14px; color: #E1E8ED; margin-top: 15px; }
    #posts-root .wrapper-content aside.profile ul { margin-top: 20px; list-style: none; }
    #posts-root .wrapper-content aside.profile ul.list li { font-size: 14px; color: #B3B3B3; display: flex; margin-top: 5px; align-items: center; }
    #posts-root .wrapper-content aside.profile li:first-child { margin: 0; }
    #posts-root .wrapper-content aside.profile ul.list img { margin-right: 10px; filter: invert(100%); }
    #posts-root .wrapper-content aside.profile .widget { margin-top: 20px; }
    #posts-root .wrapper-content aside.profile .widget strong { font-weight: normal; color: #3BB9E3; font-size: 14px; display: flex; align-items: center; }
    #posts-root .wrapper-content aside.profile .widget strong img { margin-right: 5px; filter: invert(100%); }
    #posts-root .wrapper-content aside.profile .followers ul { display: flex; flex-wrap: wrap; align-items: flex-start; align-content: flex-start; list-style: none; }
    #posts-root .wrapper-content aside.profile .followers ul li { height: 45px; width: 45px; flex: 1 0 auto; border-radius: 50%; background: #252525; margin: 0 5px 10px 0px; }

    #posts-root .wrapper-content aside.profile .images ul { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; list-style: none; }
    #posts-root .wrapper-content aside.profile .images li { width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; background: #252525; overflow: hidden; }
    #posts-root .wrapper-content aside.profile .images li img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: block; }

    #posts-root .wrapper-content .timeline { flex: 1; min-width: 0; background: #1A1A1A; margin-top: 10px; }
    #posts-root .wrapper-content .timeline .timeline-divider { border-bottom: 1px solid #3A3A3A; }
    #posts-root #posts-container { list-style: none; padding: 0; margin: 0; }
    #posts-root #posts-container li { border-bottom: 1px solid #3A3A3A; padding: 10px 15px; display: flex; position: relative; cursor: pointer; transition: background-color 0.15s ease; }
    #posts-root #posts-container li:hover { background-color: #202020; }
    #posts-root #posts-container li>img { width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0; }
    #posts-root #posts-container li .info { margin-left: 10px; display: flex; flex-direction: column; width: 100%; min-width: 0; }
    #posts-root #posts-container li .info strong { font-size: 14px; color: #E1E8ED; display: flex; align-items: center; flex-wrap: wrap; gap: 0.25em; }
    #posts-root #posts-container li .info strong span { font-size: 13px; color: #B3B3B3; font-weight: normal; }
    #posts-root #posts-container li .info p { font-size: 14px; color: #E1E8ED; margin-top: 5px; word-wrap: break-word; }

    #posts-root .repost-label {
      font-size: 12px; color: #667580; margin-bottom: 4px;
      display: flex; align-items: center; gap: 6px;
    }
    #posts-root .repost-card {
      display: block; margin-top: 8px; padding: 10px 12px;
      border: 1px solid #3A3A3A; border-radius: 10px;
      color: #3BB9E3; font-size: 13px; text-decoration: none; word-break: break-all;
    }
    #posts-root .repost-card:hover { background: #202020; }
    #posts-root .xp-badges { display: inline-flex; gap: 6px; }
    #posts-root .xp-badges a { text-decoration: none; font-size: 12px; }

    #posts-root .post-highlight { animation: postHi 2.4s ease; }
    @keyframes postHi { from { background: #26343b; } to { background: transparent; } }

    #posts-root #post-tabs li { cursor: pointer; }
    #posts-root #post-tabs li:hover span { color: #E1E8ED; }

    #posts-root #compose-post {
      display: none; background: #1A1A1A; border-bottom: 1px solid #3A3A3A; padding: 15px;
    }
    #posts-root #compose-post .compose-body { display: flex; gap: 10px; }
    #posts-root #compose-post .compose-body img { width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0; }
    #posts-root #compose-post .compose-fields { display: flex; flex-direction: column; width: 100%; }
    #posts-root #compose-post .compose-kind { display: flex; gap: 14px; margin-bottom: 6px; }
    #posts-root #compose-post .compose-kind label {
      display: flex; align-items: center; gap: 5px; color: #B3B3B3; font-size: 13px; cursor: pointer;
    }
    #posts-root #compose-post #compose-repost-url { display: none; }
    #posts-root #compose-post #compose-repost-url.show { display: block; margin-bottom: 6px; }
    #posts-root #compose-post textarea {
      width: 100%; background: transparent; border: none; resize: vertical; min-height: 60px;
      color: #E1E8ED; font-size: 15px; font-family: "Helvetica Neue", Arial, sans-serif; outline: none;
    }
    #posts-root #compose-post input[type="text"] {
      background: #252525; border: 1px solid #3A3A3A; border-radius: 8px;
      padding: 8px 10px; color: #E1E8ED; font-size: 13px; margin-top: 8px; outline: none;
      width: 100%; box-sizing: border-box;
    }
    #posts-root #compose-post .compose-image-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    #posts-root #compose-post .compose-image-row input[type="text"] { margin-top: 0; flex: 1; }
    #posts-root #compose-post .compose-upload-btn {
      flex-shrink: 0; background: #252525; border: 1px solid #3A3A3A; border-radius: 8px;
      padding: 8px 12px; color: #B3B3B3; font-size: 13px; cursor: pointer; white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    #posts-root #compose-post .compose-upload-btn:hover { background: #2a2a2a; color: #E1E8ED; }
    #posts-root #compose-post .compose-image-preview { display: none; position: relative; margin-top: 10px; width: fit-content; }
    #posts-root #compose-post .compose-image-preview.active { display: block; }
    #posts-root #compose-post .compose-image-preview img { max-width: 160px; max-height: 160px; border-radius: 8px; display: block; }
    #posts-root #compose-post .compose-image-remove {
      position: absolute; top: -8px; right: -8px; width: 22px; height: 22px; border-radius: 50%;
      background: #1A1A1A; border: 1px solid #3A3A3A; color: #E1E8ED; font-size: 13px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    #posts-root #compose-post .compose-image-remove:hover { background: #bf6a6a; }
    #posts-root #compose-post .compose-upload-hint { font-size: 11px; color: #667580; margin-top: 4px; }
    #posts-root #compose-post .compose-actions { display: flex; justify-content: flex-end; margin-top: 10px; }
    #posts-root #compose-post button {
      background: #3BB9E3; color: #FFF; border: none; border-radius: 16px;
      padding: 8px 18px; font-weight: bold; cursor: pointer;
    }
    #posts-root #compose-post button:hover { background: #2da0c7; }
    #posts-root #compose-post button:disabled { background: #2a4a56; cursor: default; }

    #posts-root #compose-post .xp-row {
      display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 12px;
      color: #B3B3B3; font-size: 13px;
    }
    #posts-root #compose-post .xp-row label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
    #posts-root #compose-post .xp-counter { margin-top: 6px; font-size: 12px; color: #667580; }
    #posts-root #compose-post .xp-counter .over { color: #E0245E; font-weight: bold; }

    #posts-root #compose-post button.xp-link-btn {
      background: transparent; color: #B3B3B3; border: 1px solid #3A3A3A;
      padding: 4px 10px; font-size: 12px; font-weight: normal; border-radius: 12px;
    }
    #posts-root #compose-post button.xp-link-btn:hover { background: #252525; color: #E1E8ED; }

    #posts-root #compose-post .xp-settings {
      display: none; flex-direction: column; gap: 6px; margin-top: 10px; padding: 12px;
      background: #202020; border: 1px solid #3A3A3A; border-radius: 10px;
    }
    #posts-root #compose-post .xp-settings.open { display: flex; }
    #posts-root #compose-post .xp-settings h4 { margin: 6px 0 0; font-size: 13px; color: #E1E8ED; }
    #posts-root #compose-post .xp-settings small { color: #667580; font-size: 11px; line-height: 1.4; }
    #posts-root #compose-post .xp-settings input[type="text"],
    #posts-root #compose-post .xp-settings input[type="password"],
    #posts-root #compose-post .xp-settings select {
      background: #252525; border: 1px solid #3A3A3A; border-radius: 8px;
      padding: 8px 10px; color: #E1E8ED; font-size: 13px; outline: none;
      width: 100%; box-sizing: border-box; margin-top: 0;
    }
    #posts-root #compose-post .xp-settings .xp-btns { display: flex; gap: 8px; margin-top: 6px; }
    #posts-root #compose-post .xp-status { margin-top: 8px; font-size: 12px; line-height: 1.6; }
    #posts-root #compose-post .xp-status.ok   { color: #6abf6a; }
    #posts-root #compose-post .xp-status.err  { color: #bf6a6a; }
    #posts-root #compose-post .xp-status.info { color: #7a9abf; }
    #posts-root #compose-post .xp-status a { color: #3BB9E3; }

    #posts-root .edit-form { margin-top: 5px; }
    #posts-root .edit-form textarea {
      width: 100%; background: #252525; border: 1px solid #3A3A3A;
      border-radius: 8px; padding: 10px; color: #E1E8ED; font-size: 14px;
      resize: vertical; min-height: 60px; margin-bottom: 8px; box-sizing: border-box;
    }
    #posts-root .edit-form .edit-actions { display: flex; justify-content: flex-end; gap: 10px; }
    #posts-root .edit-form .edit-save {
      background: #3BB9E3; color: #FFF; border: none; border-radius: 16px;
      padding: 6px 14px; font-weight: bold; cursor: pointer; font-size: 13px;
    }
    #posts-root .edit-form .edit-cancel {
      background: transparent; color: #B3B3B3; border: 1px solid #3A3A3A;
      border-radius: 16px; padding: 6px 14px; cursor: pointer; font-size: 13px;
    }

    #posts-root .post-menu-btn {
      position: absolute; top: 10px; right: 12px;
      background: transparent; border: none; color: #555;
      cursor: pointer; font-size: 20px; line-height: 1;
      padding: 2px 8px; border-radius: 6px;
      transition: background 0.15s, color 0.15s; z-index: 10;
    }
    #posts-root .post-menu-btn:hover { background: #2a2a2a; color: #E1E8ED; }
    #posts-root .post-dropdown {
      display: none; position: absolute; top: 34px; right: 12px;
      background: #252525; border: 1px solid #3A3A3A; border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6); z-index: 20;
      min-width: 140px; overflow: hidden; animation: ddIn 0.15s ease;
    }
    @keyframes ddIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    #posts-root .post-dropdown.open { display: block; }
    #posts-root .post-dropdown-btn {
      width: 100%; padding: 10px 14px; background: transparent; border: none;
      color: #bf6a6a; font-size: 13px; font-family: "Helvetica Neue", Arial, sans-serif;
      text-align: left; cursor: pointer; display: flex; align-items: center; gap: 8px;
      transition: background 0.15s;
    }
    #posts-root .post-dropdown-btn:hover { background: #2a2020; }
    #posts-root .post-dropdown-btn svg {
      width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; flex-shrink: 0;
    }

    #posts-root .post-actions {
      display: flex; gap: 10px; margin: 12px 0 0 0;
      padding-top: 6px; align-items: center; flex-wrap: wrap; width: 100%;
    }
    #posts-root .action-button {
      display: flex; align-items: center; gap: 6px;
      color: #E1E8ED; cursor: pointer; font-size: 13px; font-weight: 500;
    }
    #posts-root .action-button:hover { color: #ffffff; }
    #posts-root .action-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; }
    #posts-root .action-button.liked,
    #posts-root .action-button.liked:hover { color: #E0245E; }
    #posts-root .action-button.liked svg { fill: currentColor; stroke: currentColor; }

    @media (max-width: 760px) {
      #posts-root .bar .container { padding-left: 16px; }
      #posts-root .wrapper-content .container { flex-direction: column; padding: 0 16px; gap: 12px; }
      #posts-root .wrapper-content aside.profile { flex: 1 1 auto; width: 100%; }
      #posts-root .wrapper-content aside.profile img.avatar { margin-top: -90px; width: 140px; height: 140px; }
      #posts-root div.banner { height: 220px; }
      #posts-root .wrapper-content .timeline { margin-top: 0; }
    }
  </style>
</head>
