  <style>
    #thoughts-root {
      background: #1A1A1A;
      font-family: "Helvetica Neue", "Helvetica", Arial, sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 100px;
      text-align: left;
      overflow-x: hidden;
      max-width: 100%;
    }
    #thoughts-root *, #thoughts-root *::before, #thoughts-root *::after {
      box-sizing: border-box;
    }
    #thoughts-root div.banner {
      width: 100%; height: 380px; color: #FFF;
      display: flex; align-items: center; justify-content: center; background: #3BB9E3;
      overflow: hidden;
    }
    #thoughts-root div.banner img { width: 100%; height: 100%; object-fit: cover; }
    #thoughts-root .bar { height: 60px; display: flex; justify-content: center; background-color: #1A1A1A; box-shadow: 0 1px 1px #000000B0; }
    #thoughts-root .bar .container { align-items: center; padding-left: 285px; }
    #thoughts-root .bar .container ul { display: flex; height: 100%; list-style: none; }
    #thoughts-root .bar .container ul li { display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 0 15px; margin: 0 15px; position: relative; }
    #thoughts-root .bar .container ul li.active::after { content: ''; left: 0; width: 100%; height: 3px; bottom: 0; position: absolute; background: #3BB9E3; }
    #thoughts-root .bar .container ul li span { color: #B3B3B3; font-size: 12px; font-weight: bold; }
    #thoughts-root .bar .container ul li strong { color: #E1E8ED; font-size: 18px; margin-top: 2px; font-weight: bold; }
    #thoughts-root .bar .container ul li.active strong { color: #3BB9E3; }
    #thoughts-root .bar .container .actions button { width: 90px; height: 34px; display: flex; align-items: center; justify-content: center; margin-right: 20px; border: 0px; color: #E1E8ED; font-size: 14px; font-weight: bold; border-radius: 16px; border: 1px solid #E1E8ED; background-color: #1A1A1A; }
    #thoughts-root .bar .container .actions { display: flex; }

    #thoughts-root .wrapper-content { display: flex; justify-content: center; width: 100%; }

    #thoughts-root .wrapper-content .container {
      display: flex;
      align-items: flex-start;
      width: 100%;
      max-width: 1200px;
      padding: 0 30px;
      gap: 24px;
      background-color: #1A1A1A;
      box-sizing: border-box;
    }

    #thoughts-root .wrapper-content aside.profile { flex: 0 0 260px; width: 260px; }
    #thoughts-root .wrapper-content aside.profile img.avatar { width: 200px; height: 200px; border-radius: 50%; margin-top: -130px; border: 5px solid #1A1A1A; }
    #thoughts-root .wrapper-content aside.profile h1 { font-size: 21px; margin-top: 10px; color: #E1E8ED; }
    #thoughts-root .wrapper-content aside.profile span { font-size: 14px; color: #B3B3B3; }
    #thoughts-root .wrapper-content aside.profile p { font-size: 14px; color: #E1E8ED; margin-top: 15px; }
    #thoughts-root .wrapper-content aside.profile ul { margin-top: 20px; list-style: none; }
    #thoughts-root .wrapper-content aside.profile ul.list li { font-size: 14px; color: #B3B3B3; display: flex; margin-top: 5px; align-items: center; }
    #thoughts-root .wrapper-content aside.profile li:first-child { margin: 0; }
    #thoughts-root .wrapper-content aside.profile ul.list img { margin-right: 10px; filter: invert(100%); }
    #thoughts-root .wrapper-content aside.profile .widget { margin-top: 20px; }
    #thoughts-root .wrapper-content aside.profile .widget strong { font-weight: normal; color: #3BB9E3; font-size: 14px; display: flex; align-items: center; }
    #thoughts-root .wrapper-content aside.profile .widget strong img { margin-right: 5px; filter: invert(100%); }
    #thoughts-root .wrapper-content aside.profile .followers ul { display: flex; flex-wrap: wrap; align-items: flex-start; align-content: flex-start; list-style: none; }
    #thoughts-root .wrapper-content aside.profile .followers ul li { height: 45px; width: 45px; flex: 1 0 auto; border-radius: 50%; background: #252525; margin: 0 5px 10px 0px; }

    #thoughts-root .wrapper-content aside.profile .images ul { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; list-style: none; }
    #thoughts-root .wrapper-content aside.profile .images li { width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; background: #252525; overflow: hidden; }
    #thoughts-root .wrapper-content aside.profile .images li img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: block; }

    #thoughts-root .wrapper-content .timeline { flex: 1; min-width: 0; background: #1A1A1A; margin-top: 10px; }
    #thoughts-root .wrapper-content .timeline .timeline-divider { border-bottom: 1px solid #3A3A3A; }
    #thoughts-root #tweets-container { list-style: none; padding: 0; margin: 0; }
    #thoughts-root #tweets-container li { border-bottom: 1px solid #3A3A3A; padding: 10px 15px; display: flex; position: relative; cursor: pointer; transition: background-color 0.15s ease; }
    #thoughts-root #tweets-container li:hover { background-color: #202020; }
    #thoughts-root #tweets-container li>img { width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0; }
    #thoughts-root #tweets-container li .info { margin-left: 10px; display: flex; flex-direction: column; width: 100%; min-width: 0; }
    #thoughts-root #tweets-container li .info strong { font-size: 14px; color: #E1E8ED; display: flex; align-items: center; flex-wrap: wrap; gap: 0.25em; }
    #thoughts-root #tweets-container li .info strong span { font-size: 13px; color: #B3B3B3; font-weight: normal; }
    #thoughts-root #tweets-container li .info p { font-size: 14px; color: #E1E8ED; margin-top: 5px; word-wrap: break-word; }

    #thoughts-root .reply-form { display: none; margin-top: 15px; padding-left: 58px; animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    #thoughts-root .reply-form.active { display: block; }
    #thoughts-root .reply-form input, #thoughts-root .reply-form textarea { width: 100%; background: #252525; border: 1px solid #3A3A3A; border-radius: 8px; padding: 10px; color: #E1E8ED; font-size: 14px; margin-bottom: 10px; }
    #thoughts-root .reply-form textarea { resize: vertical; min-height: 60px; }
    #thoughts-root .reply-form button { background: #3BB9E3; color: #FFF; border: none; border-radius: 16px; padding: 8px 16px; font-weight: bold; cursor: pointer; float: right; }
    #thoughts-root .reply-form button:hover { background: #2da0c7; }
    #thoughts-root .replies-section { margin-top: 15px; padding-left: 25px; position: relative; }
    #thoughts-root .replies-section::before { content: ''; position: absolute; left: 1px; top: -20px; bottom: 0; width: 2px; background-color: #3A3A3A; z-index: 0; }
    #thoughts-root .reply { display: flex; padding: 10px 0 10px 20px; position: relative; }
    #thoughts-root .reply .info { display: flex; flex-direction: column; }
    #thoughts-root .reply .author-name { font-weight: bold; color: #E1E8ED; }
    #thoughts-root .reply .author-name span { font-weight: normal; color: #B3B3B3; font-size: 13px; }
    #thoughts-root .reply .content { color: #E1E8ED; margin-top: 4px; word-wrap: break-word; }
    #thoughts-root .reply .actions { display: flex; margin-top: 8px; }

    #thoughts-root #compose-post { display: none; background: #1A1A1A; border-bottom: 1px solid #3A3A3A; padding: 15px; }
    #thoughts-root #compose-post .compose-body { display: flex; gap: 10px; }
    #thoughts-root #compose-post .compose-body img { width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0; }
    #thoughts-root #compose-post .compose-fields { display: flex; flex-direction: column; width: 100%; }
    #thoughts-root #compose-post textarea { width: 100%; background: transparent; border: none; resize: vertical; min-height: 60px; color: #E1E8ED; font-size: 15px; font-family: "Helvetica Neue", Arial, sans-serif; outline: none; }
    #thoughts-root #compose-post input[type="text"] { background: #252525; border: 1px solid #3A3A3A; border-radius: 8px; padding: 8px 10px; color: #E1E8ED; font-size: 13px; margin-top: 8px; outline: none; width: 100%; box-sizing: border-box; }
    #thoughts-root #compose-post .compose-image-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    #thoughts-root #compose-post .compose-image-row input[type="text"] { margin-top: 0; flex: 1; }
    #thoughts-root #compose-post .compose-upload-btn { flex-shrink: 0; background: #252525; border: 1px solid #3A3A3A; border-radius: 8px; padding: 8px 12px; color: #B3B3B3; font-size: 13px; cursor: pointer; white-space: nowrap; transition: background 0.15s, color 0.15s; }
    #thoughts-root #compose-post .compose-upload-btn:hover { background: #2a2a2a; color: #E1E8ED; }

    #thoughts-root #compose-post .compose-image-remove { position: absolute; top: -8px; right: -8px; width: 22px; height: 22px; border-radius: 50%; background: #1A1A1A; border: 1px solid #3A3A3A; color: #E1E8ED; font-size: 13px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #thoughts-root #compose-post .compose-image-remove:hover { background: #bf6a6a; }
    #thoughts-root #compose-post .compose-upload-hint { font-size: 11px; color: #667580; margin-top: 4px; }
    #thoughts-root #compose-post .compose-actions { display: flex; justify-content: flex-end; margin-top: 10px; }
    #thoughts-root #compose-post button { background: #3BB9E3; color: #FFF; border: none; border-radius: 16px; padding: 8px 18px; font-weight: bold; cursor: pointer; }
    #thoughts-root #compose-post button:hover { background: #2da0c7; }
    #thoughts-root #compose-post button:disabled { background: #2a4a56; cursor: default; }

    #thoughts-root .edit-form { margin-top: 5px; }
    #thoughts-root .edit-form textarea { width: 100%; background: #252525; border: 1px solid #3A3A3A; border-radius: 8px; padding: 10px; color: #E1E8ED; font-size: 14px; resize: vertical; min-height: 60px; margin-bottom: 8px; box-sizing: border-box; }
    #thoughts-root .edit-form .edit-actions { display: flex; justify-content: flex-end; gap: 10px; }
    #thoughts-root .edit-form .edit-save { background: #3BB9E3; color: #FFF; border: none; border-radius: 16px; padding: 6px 14px; font-weight: bold; cursor: pointer; font-size: 13px; }
    #thoughts-root .edit-form .edit-cancel { background: transparent; color: #B3B3B3; border: 1px solid #3A3A3A; border-radius: 16px; padding: 6px 14px; cursor: pointer; font-size: 13px; }

    #thoughts-root #tweets-container li { position: relative; }
    #thoughts-root .twt-menu-btn { position: absolute; top: 10px; right: 12px; background: transparent; border: none; color: #555; cursor: pointer; font-size: 20px; line-height: 1; padding: 2px 8px; border-radius: 6px; transition: background 0.15s, color 0.15s; z-index: 10; }
    #thoughts-root .twt-menu-btn:hover { background: #2a2a2a; color: #E1E8ED; }
    #thoughts-root .twt-dropdown { display: none; position: absolute; top: 34px; right: 12px; background: #252525; border: 1px solid #3A3A3A; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.6); z-index: 20; min-width: 140px; overflow: hidden; animation: ddIn 0.15s ease; }
    @keyframes ddIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    #thoughts-root .twt-dropdown.open { display: block; }
    #thoughts-root .twt-dropdown-btn { width: 100%; padding: 10px 14px; background: transparent; border: none; color: #bf6a6a; font-size: 13px; font-family: "Helvetica Neue", Arial, sans-serif; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.15s; }
    #thoughts-root .twt-dropdown-btn:hover { background: #2a2020; }
    #thoughts-root .twt-dropdown-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; flex-shrink: 0; }

    #thoughts-root #tweets-container li .post-actions { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
    #thoughts-root #tweets-container li .post-actions .action-button { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; transition: background 0.15s; color: #667580; }
    #thoughts-root #tweets-container li .post-actions .action-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
    #thoughts-root #tweets-container li .post-actions .action-button:hover { background: rgba(224, 36, 94, 0.1); color: #E0245E; }
    #thoughts-root #tweets-container li .post-actions .action-button.liked { color: #E0245E; }
    #thoughts-root #tweets-container li .post-actions .action-button.liked svg { fill: #E0245E; }
    #thoughts-root #tweets-container li .post-actions .twt-reactions-box { display: flex; align-items: center; margin: 0; }
    #thoughts-root #tweets-container li .post-actions .twt-reactions-box,
    #thoughts-root #tweets-container li .post-actions .twt-reactions-box ws-widget { border: none !important; box-shadow: none !important; }

    @media (max-width: 760px) {

      #thoughts-root div.banner { height: 220px; }
      #thoughts-root .wrapper-content .timeline { margin-top: 0; }
    }
  </style>
