    #container > .caixamaisclara {
      width: 100%;
      box-sizing: border-box;

      background-color: #0a0a0a;
      flex-direction: column;
      align-items: center;

    #container > .caixamaisclara > .conjuntoblocos {
      background-color: #141414;
      border: none !important;
      outline: none !important;
      border-radius: 3px;
      padding: 24px 20px;
      width: 650px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .imagem-circular {
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 0.6rem;
      transition: transform 0.3s ease-in-out;
    }
    .imagem-circular img {
      width: 250px;
      height: 250px;
      border-radius: 50%;
      box-shadow: 0 0 0.625rem rgba(0,0,0,0.5);
    }
    .imagem-circular:hover { transform: scale(1.05); }

    h2.h2text {
      font-family: "OldEnglishGothicPixelRegular", serif;
      font-size: 2.2rem;
      color: #4b4b4b;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
      margin: 0.1rem 0 0.05rem;
      text-align: center;
    }

    .bio {
      font-family: "MinFont", monospace;
      font-size: 0.82rem;
      color: #4b4b4b;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
      line-height: 1.7;
      margin-bottom: 0.4rem;
      text-align: center;
    }

    .contact-links { width: 260px; margin: 0 auto 1.1rem; }

    .pushable {
      position: relative;
      border: none;
      background: #2e2e2e;
      border-radius: 4px;
      padding: 0;
      cursor: pointer;
      outline-offset: 4px;
      transition: filter 250ms;
      text-decoration: none;
      display: block;
      width: 100%;
    }

    .shadow {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: 4px;
      background: rgba(0,0,0,0.45);
      will-change: transform;
      transform: translateY(3px);
      transition: transform 600ms cubic-bezier(0.3, 0.7, 0.4, 1);
    }

    .edge { display: none; }

    .front {
      display: block;
      position: relative;
      padding: 8px 28px;
      border-radius: 4px;
      font-size: 1.1rem;
      color: #5a5a5a;
      font-family: "MinFont", monospace;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
      background: #1f1f1f;
      will-change: transform;
      transform: translateY(-4px);
      transition: transform 600ms cubic-bezier(0.3, 0.7, 0.4, 1);
    }

    .pushable:hover { filter: brightness(115%); }

    .pushable:hover .front {
      transform: translateY(-6px);
      transition: transform 250ms cubic-bezier(0.3, 0.7, 0.4, 1.5);
    }

    .pushable:active .front {
      transform: translateY(-2px);
      transition: transform 34ms;
    }

    .pushable:hover .shadow {
      transform: translateY(5px);
      transition: transform 250ms cubic-bezier(0.3, 0.7, 0.4, 1.5);
    }

    .pushable:active .shadow {
      transform: translateY(1px);
      transition: transform 34ms;
    }

    .pushable:focus:not(:focus-visible) { outline: none; }

    .ds-tooltip {
      position: relative;
      display: block;
      overflow: visible;
    }
    .ds-tooltip::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: #0a0a0a;
      color: #4b4b4b;
      outline: 1px solid #1a1a1a;
      font-family: "MinFont", monospace;
      font-size: 0.72rem;
      padding: 4px 8px;
      white-space: nowrap;
      border-radius: 1px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 999;
      text-shadow: none;
    }
    .ds-tooltip::before {
      content: "";
      position: absolute;
      bottom: calc(100% - 6px);
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: #0a0a0a;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 1000;
    }
    .ds-tooltip:hover::after,
    .ds-tooltip:hover::before { opacity: 1; }

    .desaturatepics {
      filter: saturate(0.2);
      transition: filter 0.3s ease;
    }
    .desaturatepics:hover { filter: saturate(1); }

    .footimg { margin: 6px; }
