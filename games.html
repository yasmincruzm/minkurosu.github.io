<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>game diary</title>
    <style>

        
.skin-item {
  background-color: #0a0a0a;
  border: 4px solid #310000;
  border-radius: 3px;
  padding: 15px;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  transition: transform 0.2s ease-in-out;
}

.skin-item:hover {
  transform: translateY(-5px);
  box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
}


.skin-item img {
  max-width: 100%;
  height: auto;
  display: block;
  margin-bottom: 10px;
  border-radius: 2px;
}

.skin-title {
  font-size: 1rem;
  color: #610000;
  margin: 0;
  padding-top: 5px;
  text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
  font-weight: 500;
}

@media (max-width: 768px) {
  .skin-grid-container {
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 15px;
  }

  .skin-item {
    padding: 10px;
  }

  .skin-title {
    font-size: 0.8em;
  }
}

@media (max-width: 480px) {
  .skin-grid-container {
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 10px;
  }

  .skin-item {
    padding: 8px;
  }

  .skin-title {
    font-size: 0.75em;
  }
}



.skin-item {
  background-color: #0a0a0a;
  border: 4px solid #310000;
  border-radius: 3px;
  padding: 15px;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  transition: transform 0.2s ease-in-out;
}
.skin-grid-container {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  padding: 20px;
  max-width: 1200px;
  margin: 0 auto;
  border-radius: 3px;
  text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
}

        .caixamaisclaraInterests {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .games-title {
            text-align: center;
            margin: 20px 0;
            color: #534F4A;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            text-transform: lowercase;
            font-size: 2em;
        }

        .games-button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            padding: 0;
        }

        #gameContent {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            background-color: transparent;
            min-height: 400px;
            color: #610000;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .skin-title {
            font-size: 1rem;
            color: #610000;


        }

        #gameContent:not(:empty) {
            animation: fadeIn 0.3s ease-in;
        }
    </style>
</head>

<body>
    <div class="games-section">
        <div class="caixamaisclaraInterests">
            <h1 class="games-title">choose a game!</h1>
            <div class="games-button-container">
                <a href="#" class="pushable game-button-link" data-src="minecraft.html">
                    <span class="shadow"></span>
                    <span class="edge"></span>
                    <span class="front">minecraft</span>
                </a>
                 <a href="#" class="pushable game-button-link" data-src="baldursgate.html">
                    <span class="shadow"></span>
                    <span class="edge"></span>
                    <span class="front">baldurs gate 3</span>
                </a>

                
                <a href="#" class="pushable game-button-link" data-src="transformice.html">
                    <span class="shadow"></span>
                    <span class="edge"></span>
                    <span class="front">transformice</span>
                </a>


                   <a href="#" class="pushable game-button-link" data-src="tomodachi.html">
                    <span class="shadow"></span>
                    <span class="edge"></span>
                    <span class="front">tomodachi life</span>
                </a>
               


                <a href="#" class="pushable game-button-link" data-src="growtopia.html">
                    <span class="shadow"></span>
                    <span class="edge"></span>
                    <span class="front">growtopia</span>
                </a>
                <a href="#" class="pushable game-button-link" data-src="stardewvalley.html">
                    <span class="shadow"></span>
                    <span class="edge"></span>
                    <span class="front">stardew valley</span>
                </a>
                
               
            </div>
        </div>

        <div id="gameContent"></div>
    </div>

    <script>

        (function () {
            'use strict';

            console.log('🎮 Games.html carregado!');

            let initialized = false;

            function initializeGames() {
                if (initialized) {
                    console.log('starting');
                    return;
                }

                const buttons = document.querySelectorAll('.game-button-link');
                const contentDiv = document.getElementById('gameContent');

                if (!contentDiv) {
                    console.log('not found');
                    return;
                }

                if (buttons.length === 0) {
                    console.log('not found');
                    return;
                }

                console.log(`loading ${buttons.length}...`);
                initialized = true;

                function loadGame(url) {
                    console.log('loading:', url);
                    contentDiv.innerHTML = '<h1 style="text-align:center;padding:20px;color:#534F4A;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;">Loading...</h1>';

                    fetch(url)
                        .then(response => {
                            if (!response.ok) throw new Error(`HTTP ${response.status}`);
                            return response.text();
                        })
                        .then(html => {
                            console.log('HTML on');

                            const parser = new DOMParser();
                            const doc = parser.parseFromString(html, 'text/html');
                            const main = doc.querySelector('main') || doc.querySelector('body');

                            if (!main) {
                                throw new Error('Conteúdo não encontrado');
                            }

                            contentDiv.innerHTML = main.innerHTML;
                            console.log('!');

                            const scripts = contentDiv.querySelectorAll('script');
                            console.log(` ${scripts.length} scripts...`);

                            scripts.forEach((oldScript) => {
                                const newScript = document.createElement('script');

                                if (oldScript.src) {
                                    newScript.src = oldScript.src;
                                } else {
                                    newScript.textContent = oldScript.textContent;
                                }

                                oldScript.parentNode.removeChild(oldScript);
                                document.body.appendChild(newScript);
                            });

                            console.log('scrips on');
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            contentDiv.innerHTML = `
                            <div style="text-align:center;padding:40px;">
                                <h1 style="color:#8B0000;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;">
                                    Error loading ${url}
                                </h1>
                                <p style="color:#534F4A;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;">
                                    ${error.message}
                                </p>
                            </div>
                        `;
                        });
                }

                buttons.forEach((btn) => {
                    const newBtn = btn.cloneNode(true);
                    btn.parentNode.replaceChild(newBtn, btn);
                });

                const freshButtons = document.querySelectorAll('.game-button-link');

                freshButtons.forEach((button) => {
                    button.addEventListener('click', function (e) {
                        e.preventDefault();
                        e.stopPropagation();

                        const gameSrc = this.getAttribute('data-src');
                        console.log('🖱️ Clique:', gameSrc);

                        freshButtons.forEach(b => b.classList.remove('active'));

                        this.classList.add('active');

                        loadGame(gameSrc);
                    });
                });

                console.log(' loading...');
                if (freshButtons[0]) {
                    freshButtons[0].click();
                }
            }


            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initializeGames);
            } else {
                initializeGames();
            }

            setTimeout(initializeGames, 100);
            setTimeout(initializeGames, 300);

            window.addEventListener('load', function () {
                if (!initialized) {
                    console.log('trying to load...');
                    initializeGames();
                }
            });

            window.initGamesPage = initializeGames;

        })();
    </script>
</body>

</html>
