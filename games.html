<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="emo.css">
    <style>

        .caixamaisclaraInterests {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .games-title {
            text-align: center;
            margin: 20px 0;
            color: #534F4A;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            text-transform: lowercase;
            font-size: 2em;
        }

        .games-button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            padding: 0;
        }

        .game-tab-radio {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .games-button-container label {
            cursor: pointer;
        }

        #gameContent {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            background-color: transparent;
            position: relative; 
        }

        .game-frame {
            display: block;
            width: 100%;
            height: 400px;
            border: none;
            border-radius: 0.9375rem;
            transition: height 0.15s ease;
           
            position: absolute;
            top: 20px;
            left: 20px;
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
            z-index: 0;
        }

        #tab-minecraft:checked~#gameContent #frame-minecraft,
        #tab-bg3:checked~#gameContent #frame-bg3,
        #tab-transformice:checked~#gameContent #frame-transformice,
        #tab-tomodachi:checked~#gameContent #frame-tomodachi,
        #tab-growtopia:checked~#gameContent #frame-growtopia,
        #tab-stardew:checked~#gameContent #frame-stardew {
            position: relative;
            top: 0;
            left: 0;
            visibility: visible;
            opacity: 1;
            pointer-events: auto;
            z-index: 1;
        }

       

        
.screenshots,
.screenshot-gallery img,
a[data-fancybox] img,
.fancybox-image,
.fancybox__image,
.fancybox-content img,
.fancybox__content img {
    width: auto !important;
    height: auto !important;
    max-width: 100% !important;
    max-height: 100% !important;
    object-fit: contain !important;
    display: block !important;
    margin: 0 auto !important;
    border-radius: 6px;
    box-sizing: border-box;
}
 
a[data-fancybox] {
    display: block;
    max-width: 100%;
    text-align: center;
}
 
.screenshotDescription {
    text-align: center;
    color: #534F4A;
    text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
}
 


    </style>
</head>

<body>
    <div class="games-section">

        <input type="radio" name="game-tab" id="tab-minecraft" class="game-tab-radio" checked>
        <input type="radio" name="game-tab" id="tab-bg3" class="game-tab-radio">
        <input type="radio" name="game-tab" id="tab-transformice" class="game-tab-radio">
        <input type="radio" name="game-tab" id="tab-tomodachi" class="game-tab-radio">
        <input type="radio" name="game-tab" id="tab-growtopia" class="game-tab-radio">
        <input type="radio" name="game-tab" id="tab-stardew" class="game-tab-radio">

        <div class="caixamaisclaraInterests">
            <h1 class="games-title">choose a game!</h1>
            <div class="games-button-container">
                <label for="tab-minecraft" class="pushable">
                    <span class="shadow"></span>
                    <span class="edge"></span>
                    <span class="front">minecraft</span>
                </label>

                <label for="tab-bg3" class="pushable">
                    <span class="shadow"></span>
                    <span class="edge"></span>
                    <span class="front">baldurs gate 3</span>
                </label>

                <label for="tab-transformice" class="pushable">
                    <span class="shadow"></span>
                    <span class="edge"></span>
                    <span class="front">transformice</span>
                </label>

                <label for="tab-tomodachi" class="pushable">
                    <span class="shadow"></span>
                    <span class="edge"></span>
                    <span class="front">tomodachi life</span>
                </label>

                <label for="tab-growtopia" class="pushable">
                    <span class="shadow"></span>
                    <span class="edge"></span>
                    <span class="front">growtopia</span>
                </label>

                <label for="tab-stardew" class="pushable">
                    <span class="shadow"></span>
                    <span class="edge"></span>
                    <span class="front">stardew valley</span>
                </label>
            </div>
        </div>

        <div id="gameContent">
            <iframe id="frame-minecraft" class="game-frame" src="minecraft.html"></iframe>
            <iframe id="frame-bg3" class="game-frame" src="baldursgate.html"></iframe>
            <iframe id="frame-transformice" class="game-frame" src="transformice.html"></iframe>
            <iframe id="frame-tomodachi" class="game-frame" src="tomodachi.html"></iframe>
            <iframe id="frame-growtopia" class="game-frame" src="growtopia.html"></iframe>
            <iframe id="frame-stardew" class="game-frame" src="stardewvalley.html"></iframe>
        </div>
    </div>

    <script>
    (function () {

    
        if (typeof window.__gamesFrameCleanup === 'function') {
            window.__gamesFrameCleanup();
        }

        const frames = Array.from(document.querySelectorAll('.game-frame'));
        const watched = new WeakSet();
        const observers = [];
        const pendingTimeouts = [];
        let resizeTimer;
        let resizeHandler;
        let radioHandlers = [];
        let destroyed = false;

        function measure(iframe) {
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                if (!doc || !doc.documentElement) return 0;
                return Math.max(
                    doc.documentElement.scrollHeight,
                    doc.body ? doc.body.scrollHeight : 0
                );
            } catch (e) {
                return 0;
            }
        }

        function applyHeight(iframe) {
            if (destroyed) return;
            const h = measure(iframe);
            if (h > 0) iframe.style.height = h + 'px';
        }

        function watch(iframe) {
            if (watched.has(iframe)) return;
            watched.add(iframe);

            let attempts = 0;
            function poll() {
                if (destroyed) return;
                applyHeight(iframe);
                attempts++;
                if (attempts < 24) {
                    const id = setTimeout(poll, 250);
                    pendingTimeouts.push(id);
                }
            }

            const start = () => {
                if (destroyed) return;
                poll();
                try {
                    const doc = iframe.contentDocument || iframe.contentWindow.document;
                    if ('ResizeObserver' in window) {
                        const ro = new ResizeObserver(() => applyHeight(iframe));
                        ro.observe(doc.documentElement);
                        if (doc.body) ro.observe(doc.body);
                        observers.push(ro);
                    }
                } catch (e) { }
            };

            if (iframe.contentDocument && iframe.contentDocument.readyState === 'complete') {
                start();
            } else {
                iframe.addEventListener('load', start, { once: true });
            }
        }

        frames.forEach(watch);

        document.querySelectorAll('.game-tab-radio').forEach(radio => {
            const handler = () => {
                requestAnimationFrame(() => frames.forEach(applyHeight));
            };
            radio.addEventListener('change', handler);
            radioHandlers.push({ radio, handler });
        });

        resizeHandler = () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => frames.forEach(applyHeight), 200);
        };
        window.addEventListener('resize', resizeHandler);

        window.__gamesFrameCleanup = function () {
            destroyed = true;
            observers.forEach(ro => ro.disconnect());
            pendingTimeouts.forEach(id => clearTimeout(id));
            clearTimeout(resizeTimer);
            if (resizeHandler) window.removeEventListener('resize', resizeHandler);
            radioHandlers.forEach(({ radio, handler }) => radio.removeEventListener('change', handler));
        };
    })();
    </script>
</body>

</html>
