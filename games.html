<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="emo.css">
    <style>

        .caixamaisclaraInterests {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .games-title {
            text-align: center;
            margin: 20px 0;
            color: #534F4A;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            text-transform: lowercase;
            font-size: 2em;
        }

        .games-button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            padding: 0;
        }

        .game-tab-radio {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .games-button-container label {
            cursor: pointer;
        }

        #gameContent {
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            background-color: transparent;
            position: relative; 
        }

        .game-frame {
            display: none;
            width: 100%;
            height: 400px;
            border-radius: 0.9375rem;
            background-color: #24211e;
            transition: height 0.25s ease;
        }

        #tab-minecraft:checked~#gameContent #frame-minecraft,
        #tab-bg3:checked~#gameContent #frame-bg3,
        #tab-transformice:checked~#gameContent #frame-transformice,
        #tab-tomodachi:checked~#gameContent #frame-tomodachi,
        #tab-growtopia:checked~#gameContent #frame-growtopia,
        #tab-stardew:checked~#gameContent #frame-stardew {
            display: block;

            animation: expandIn 0.25s ease;
        }

       

        
.screenshots,
.screenshot-gallery img,
a[data-fancybox] img,
.fancybox-image,
.fancybox__image,
.fancybox-content img,
.fancybox__content img {
    width: auto !important;
    height: auto !important;
    max-width: 100% !important;
    max-height: 100% !important;
    object-fit: contain !important;
    display: block !important;
    margin: 0 auto !important;
    border-radius: 6px;
    box-sizing: border-box;
}
 
a[data-fancybox] {
    display: block;
    max-width: 100%;
    text-align: center;
}
 
.screenshotDescription {
    text-align: center;
    color: #534F4A;
    text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
}
 


    </style>
</head>

<body>
    <div class="games-section">

        <input type="radio" name="game-tab" id="tab-minecraft" class="game-tab-radio" checked>
        <input type="radio" name="game-tab" id="tab-bg3" class="game-tab-radio">
        <input type="radio" name="game-tab" id="tab-transformice" class="game-tab-radio">
        <input type="radio" name="game-tab" id="tab-tomodachi" class="game-tab-radio">
        <input type="radio" name="game-tab" id="tab-growtopia" class="game-tab-radio">
        <input type="radio" name="game-tab" id="tab-stardew" class="game-tab-radio">

        <div class="caixamaisclaraInterests">
            <h1 class="games-title">choose a game!</h1>
            <div class="games-button-container">
                <label for="tab-minecraft" class="pushable">
                    <span class="shadow"></span>
                    <span class="edge"></span>
                    <span class="front">minecraft</span>
                </label>

                <label for="tab-bg3" class="pushable">
                    <span class="shadow"></span>
                    <span class="edge"></span>
                    <span class="front">baldurs gate 3</span>
                </label>

                <label for="tab-transformice" class="pushable">
                    <span class="shadow"></span>
                    <span class="edge"></span>
                    <span class="front">transformice</span>
                </label>

                <label for="tab-tomodachi" class="pushable">
                    <span class="shadow"></span>
                    <span class="edge"></span>
                    <span class="front">tomodachi life</span>
                </label>

                <label for="tab-growtopia" class="pushable">
                    <span class="shadow"></span>
                    <span class="edge"></span>
                    <span class="front">growtopia</span>
                </label>

                <label for="tab-stardew" class="pushable">
                    <span class="shadow"></span>
                    <span class="edge"></span>
                    <span class="front">stardew valley</span>
                </label>
            </div>
        </div>

        <div id="gameContent">
            <iframe id="frame-minecraft" class="game-frame" src="minecraft.html"></iframe>
            <iframe id="frame-bg3" class="game-frame" src="baldursgate.html"></iframe>
            <iframe id="frame-transformice" class="game-frame" src="transformice.html"></iframe>
            <iframe id="frame-tomodachi" class="game-frame" src="tomodachi.html"></iframe>
            <iframe id="frame-growtopia" class="game-frame" src="growtopia.html"></iframe>
            <iframe id="frame-stardew" class="game-frame" src="stardewvalley.html"></iframe>
        </div>
    </div>

    <script>
        (function () {
            function getInnerDoc(iframe) {
                try {
                    return iframe.contentDocument || iframe.contentWindow.document;
                } catch (e) {
                    return null;
                }
            }

            function resizeFrame(iframe) {
                if (!iframe) return;
                const doc = getInnerDoc(iframe);
                if (!doc || !doc.body) return;
                const height = Math.max(
                    doc.documentElement ? doc.documentElement.scrollHeight : 0,
                    doc.body.scrollHeight
                );
                if (height > 0) {
                    iframe.style.height = height + 'px';
                }
            }

            function watchFrame(iframe) {
                let observed = false;

                function setup() {
                    resizeFrame(iframe);
                    const doc = getInnerDoc(iframe);
                    if (!doc || !doc.body || observed) return;
                    observed = true;

                    if (typeof ResizeObserver !== 'undefined') {
                        const ro = new ResizeObserver(() => resizeFrame(iframe));
                        ro.observe(doc.body);
                    }

                    doc.querySelectorAll('img').forEach((img) => {
                        if (!img.complete) {
                            img.addEventListener('load', () => resizeFrame(iframe));
                            img.addEventListener('error', () => resizeFrame(iframe));
                        }
                    });
                }

                iframe.addEventListener('load', setup);
            }

            document.querySelectorAll('.game-frame').forEach(watchFrame);

            document.querySelectorAll('.game-tab-radio').forEach((radio) => {
                radio.addEventListener('change', function () {
                    // pequeno delay pra deixar o CSS trocar o display antes de medir
                    setTimeout(() => {
                        document.querySelectorAll('.game-frame').forEach((iframe) => {
                            if (getComputedStyle(iframe).display !== 'none') {
                                resizeFrame(iframe);
                            }
                        });
                    }, 50);
                });
            });
        })();
    </script>

</body>

</html>
