<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="emo.css">
    <style>
        .caixamaisclaraInterests {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .games-title {
            text-align: center;
            margin: 20px 0;
            color: #534F4A;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            text-transform: lowercase;
            font-size: 2em;
        }

        .games-button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            padding: 0;
        }

        .game-tab-radio {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .games-button-container label {
            cursor: pointer;
        }

        #gameContent {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        .game-frame {
            display: none;
            width: 100%;
            height: 700px;
            border: none;
            border-radius: 8px;
            overflow: hidden;
        }

        #tab-minecraft:checked ~ #gameContent #frame-minecraft,
        #tab-bg3:checked ~ #gameContent #frame-bg3,
        #tab-transformice:checked ~ #gameContent #frame-transformice,
        #tab-tomodachi:checked ~ #gameContent #frame-tomodachi,
        #tab-growtopia:checked ~ #gameContent #frame-growtopia,
        #tab-stardew:checked ~ #gameContent #frame-stardew {
            display: block;
            animation: expandIn 0.25s ease;
        }

        @keyframes expandIn {
            from { opacity: 0.6; transform: scaleY(0.97); }
            to { opacity: 1; transform: scaleY(1); }
        }
    </style>
</head>

<body>
    <div class="games-section">

        <input type="radio" name="game-tab" id="tab-minecraft" class="game-tab-radio" checked>
        <input type="radio" name="game-tab" id="tab-bg3" class="game-tab-radio">
        <input type="radio" name="game-tab" id="tab-transformice" class="game-tab-radio">
        <input type="radio" name="game-tab" id="tab-tomodachi" class="game-tab-radio">
        <input type="radio" name="game-tab" id="tab-growtopia" class="game-tab-radio">
        <input type="radio" name="game-tab" id="tab-stardew" class="game-tab-radio">

        <div class="caixamaisclaraInterests">
            <h1 class="games-title">choose a game!</h1>
            <div class="games-button-container">
                <label for="tab-minecraft" class="pushable"><span class="shadow"></span><span class="edge"></span><span class="front">minecraft</span></label>
                <label for="tab-bg3" class="pushable"><span class="shadow"></span><span class="edge"></span><span class="front">baldurs gate 3</span></label>
                <label for="tab-transformice" class="pushable"><span class="shadow"></span><span class="edge"></span><span class="front">transformice</span></label>
                <label for="tab-tomodachi" class="pushable"><span class="shadow"></span><span class="edge"></span><span class="front">tomodachi life</span></label>
                <label for="tab-growtopia" class="pushable"><span class="shadow"></span><span class="edge"></span><span class="front">growtopia</span></label>
                <label for="tab-stardew" class="pushable"><span class="shadow"></span><span class="edge"></span><span class="front">stardew valley</span></label>
            </div>
        </div>

        <div id="gameContent">
            <iframe id="frame-minecraft" class="game-frame" src="minecraft.html"></iframe>
            <iframe id="frame-bg3" class="game-frame" src="baldursgate.html"></iframe>
            <iframe id="frame-transformice" class="game-frame" src="transformice.html"></iframe>
            <iframe id="frame-tomodachi" class="game-frame" src="tomodachi.html"></iframe>
            <iframe id="frame-growtopia" class="game-frame" src="growtopia.html"></iframe>
            <iframe id="frame-stardew" class="game-frame" src="stardewvalley.html"></iframe>
        </div>
    </div>

    <script>
        (function () {
            function resizeFrame(iframe) {
                try {
                    var doc = iframe.contentDocument || iframe.contentWindow.document;
                    if (!doc || !doc.body) return;
                    var h = doc.documentElement.scrollHeight || doc.body.scrollHeight;
                    if (h > 0) iframe.style.height = h + 'px';
                } catch (e) {}
            }

            document.querySelectorAll('.game-frame').forEach(function (iframe) {
                iframe.addEventListener('load', function () {
                    resizeFrame(iframe);
                    try {
                        var doc = iframe.contentDocument || iframe.contentWindow.document;
                        if (doc && doc.body && typeof ResizeObserver !== 'undefined') {
                            new ResizeObserver(function () { resizeFrame(iframe); }).observe(doc.body);
                        }
                    } catch (e) {}
                });
            });
        })();
    </script>
</body>

</html>
