  .image-grid-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    width: 100%;
    box-sizing: border-box;
    margin: 10px 0;
}
.grid-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}
.grid-item img {
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    display: block;
    border-radius: 2px;
    transition: transform 0.2s ease;
}
.grid-item img:hover { transform: scale(1.04); }
.grid-item h3 {
    font-size: 0.8rem;
    text-align: center;
    margin: 2px 0 0 0;
    padding: 0;
    line-height: 1.2;
}

.picrew-grid-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    width: 100%;
    box-sizing: border-box;
    margin: 10px 0;
}
.picrew-grid-item a {
    display: block;
    line-height: 0;
}
.picrew-grid-item img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    border-radius: 2px;
    transition: transform 0.2s ease;
}
.picrew-grid-item img:hover { transform: scale(1.04); }

@media (max-width: 500px) {
    .image-grid-container { grid-template-columns: repeat(2, 1fr); }
    .picrew-grid-container { grid-template-columns: repeat(3, 1fr); }
}
