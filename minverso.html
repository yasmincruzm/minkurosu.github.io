    <style>
        .image-grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: 100%;
            box-sizing: border-box;
            margin: 10px 0;
        }
        .grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .grid-item img {
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            display: block;
            border-radius: 2px;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        .grid-item img:hover { transform: scale(1.04); filter: saturate(0.3); }
        .grid-item h3 {
            font-size: 0.8rem;
            text-align: center;
            margin: 2px 0 0 0;
            padding: 0;
            line-height: 1.2;
        }

        #webweaving-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 6px;
        }

        .ww-grid {
            column-count: 3;
            column-gap: 6px;
            padding: 0;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 600px) {
            .ww-grid { column-count: 2; }
        }

        .ww-cell {
            break-inside: avoid;
            page-break-inside: avoid;
            -webkit-column-break-inside: avoid;
            display: block;
            width: 100%;
            margin: 0 0 6px 0;
            padding: 0;
            position: relative;
            line-height: 0;
            border: 1px solid #310000;
            border-radius: 2px;
            overflow: hidden;
            background: #0a0a0a;
            cursor: url('imgs/cursor/ROCKcursorselect.cur'), pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .ww-cell .thumb-img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0;
            padding: 0;
            transition: transform 0.15s ease-in-out, filter 0.15s ease-in-out;
        }

        .ww-cell:hover .thumb-img {
            transform: scale(1.03);
            filter: saturate(0.4) brightness(1.05);
        }

        @media (max-width: 500px) {
            .image-grid-container { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
