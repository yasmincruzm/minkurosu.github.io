  <style>
   
   
    .grid-feed {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      box-sizing: border-box;
    }

    .grid-feed img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      aspect-ratio: 1 / 1;
      display: block;
      transition: transform 0.2s ease;
    }

    .grid-feed a {
      display: block;
      position: relative;
      overflow: hidden;
      border-radius: 2px;
    }

    .grid-feed a:hover img { transform: scale(1.05); }

  </style>
</head>
