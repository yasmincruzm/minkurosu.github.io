    @keyframes flicker {

    .crt::after {

    .contact-links { width: 380px; margin: 0 auto 0.7rem; }

    .contact-links {

    .contact-links .pushable {
      width: 50% !important;

    .pushable {
      position: relative;
      border: none;
      background: #2e2e2e;
      border-radius: 4px;
      padding: 0;
      cursor: url(/imgs/cursor/ROCKcursorselect.cur), pointer;
      outline-offset: 4px;
      transition: filter 250ms;
      text-decoration: none;
      display: block;
      width: 50%;
      object-position: center;
    }

    .shadow {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: 4px;
      background: rgba(0,0,0,0.45);
      will-change: transform;
      transform: translateY(3px);
      transition: transform 600ms cubic-bezier(0.3, 0.7, 0.4, 1);
    }

    .edge { display: none; }

    .front {
      display: block;
      position: relative;
      padding: 8px 28px;
      border-radius: 4px;
      font-size: 1.1rem;
      color: #5a5a5a;
      font-family: "MinFont", monospace;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
      background: #1f1f1f;
      will-change: transform;
      transform: translateY(-4px);
      transition: transform 600ms cubic-bezier(0.3, 0.7, 0.4, 1);
    }

    .pushable:hover { filter: brightness(115%); }

    .pushable:hover .front {
      transform: translateY(-6px);
      transition: transform 250ms cubic-bezier(0.3, 0.7, 0.4, 1.5);
    }

    .pushable:active .front {
      transform: translateY(-2px);
      transition: transform 34ms;
    }

    .pushable:hover .shadow {
      transform: translateY(5px);
      transition: transform 250ms cubic-bezier(0.3, 0.7, 0.4, 1.5);
    }

    .pushable:active .shadow {
      transform: translateY(1px);
      transition: transform 34ms;
    }

    .pushable:focus:not(:focus-visible) { outline: none; }

    .site-banner-link {

    .ds-tooltip {
      position: relative;
      display: inline-block;
      overflow: visible;
    }
    .ds-tooltip::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: #0a0a0a;
      color: #4b4b4b;
      outline: 1px solid #1a1a1a;
      font-family: "MinFont", monospace;
      font-size: 0.75rem;
      padding: 4px 8px;
      white-space: nowrap;
      border-radius: 1px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 999;
      text-shadow: none;
    }
    .ds-tooltip::before {
      content: "";
      position: absolute;
      bottom: calc(100% - 6px);
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: #0a0a0a;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 1000;
    }
    .ds-tooltip:hover::after,
    .ds-tooltip:hover::before { opacity: 1; }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pagein {
      0%   { opacity: 0; filter: blur(6px); transform: scale(0.97); }
      60%  { filter: blur(0px); }
      100% { opacity: 1; transform: scale(1); }

    body { animation: pagein 0.7s cubic-bezier(0.22, 1, 0.36, 1) both; }
    #container { animation: fadein 0.5s 0.1s ease both; }
    .contact-links { opacity: 0; animation: fadein 0.4s ease forwards; }
